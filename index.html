<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한국 검도 세대별 선수 종합 리포트 2026</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Bebas+Neue&display=swap');
:root {
  --bg:#0a0a0a; --bg2:#111; --bg3:#161616;
  --border:#1e1e1e; --border2:#2a2a2a;
  --text:#e0e0e0; --text2:#888; --text3:#555;
  --gold:#c9a84c; --gold2:#f5c842;
  --blue2:#4a90d9; --red2:#e05555;
  --green2:#4acc7a; --purple2:#9a60e0;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);}

/* HEADER */
.hd{background:linear-gradient(135deg,#0a0a0a,#111,#0d1a2e);border-bottom:1px solid var(--border2);padding:22px 20px 16px;}
.h1{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;color:#fff;}
.hsub{font-size:11px;color:var(--text3);margin-top:5px;}
.hbadges{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
.hb{font-size:10px;font-weight:700;padding:2px 9px;border-radius:2px;border:1px solid;}
.hb-b{border-color:var(--blue2);color:var(--blue2);}
.hb-g{border-color:var(--green2);color:var(--green2);}
.hb-r{border-color:var(--red2);color:var(--red2);}
.hb-p{border-color:var(--purple2);color:var(--purple2);}
.hb-gold{border-color:var(--gold);color:var(--gold);}

/* NAV */
.nav{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;}
.nav::-webkit-scrollbar{display:none;}
.nt{padding:11px 18px;font-size:11.5px;font-weight:700;color:var(--text3);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:all .2s;}
.nt:hover{color:var(--text);}
.nt.on{color:var(--gold2);border-bottom-color:var(--gold2);}
.search-bar{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--bg2);border-bottom:1px solid var(--border);}
.search-input{flex:1;background:#111;border:1px solid var(--border2);border-radius:4px;padding:8px 12px;color:#fff;font-size:13px;outline:none;}
.search-input:focus{border-color:var(--gold2);}
.search-input::placeholder{color:var(--text3);}
.search-count{font-size:11px;color:var(--text3);white-space:nowrap;min-width:90px;text-align:right;}
.search-clear{background:none;border:none;color:var(--text3);cursor:pointer;font-size:16px;padding:2px 6px;display:none;}
.search-clear:hover{color:#fff;}
tr.search-hide{display:none;}
tr.search-match td{background:rgba(245,200,66,0.07);}
mark.sm{background:var(--gold2);color:#111;padding:0 2px;border-radius:2px;font-weight:700;}
.sec.search-hide-sec{display:none;}

/* CONTENT */
.ct{padding:16px 14px;max-width:1200px;}
.pn{display:none;} .pn.on{display:block;}

/* SECTION */
.sec{margin-bottom:24px;}
.sec-hd{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:7px;border-bottom:1px solid var(--border);}
.sec-hd h2{font-size:13px;font-weight:700;color:#fff;}
.sb{font-size:10px;font-weight:700;padding:2px 8px;border-radius:2px;}
.sb-elem{background:rgba(74,144,217,0.15);color:#7ab8f5;}
.sb-mid{background:rgba(74,144,217,0.12);color:var(--blue2);}
.sb-hi{background:rgba(74,204,122,0.10);color:var(--green2);}
.sb-univ{background:rgba(224,85,85,0.10);color:var(--red2);}
.sb-real{background:rgba(154,96,224,0.10);color:var(--purple2);}
.sb-natl{background:rgba(201,168,76,0.12);color:var(--gold);}
.sb-jp{background:rgba(224,85,85,0.14);color:#ff8a8a;}

/* TABLE */
.tw{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:11.5px;min-width:680px;}
thead th{background:var(--bg3);color:var(--text3);font-weight:500;padding:7px 9px;text-align:left;border-bottom:1px solid var(--border2);font-size:10px;letter-spacing:.4px;white-space:nowrap;}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s;}
tbody tr:hover{background:var(--bg3);}
tbody td{padding:8px 9px;color:#b0b0b0;vertical-align:middle;line-height:1.4;white-space:nowrap;}
td.note{white-space:normal;min-width:160px;}
.pn_{font-weight:700;color:#fff;font-size:12.5px;}
.sch{color:var(--blue2);font-weight:500;}
.gr{color:var(--gold);font-weight:700;font-size:11px;}
.note{color:var(--text3);font-size:10px;}

/* TAG */
.tag{display:inline-block;font-size:9px;font-weight:700;padding:1px 5px;border-radius:2px;margin-left:3px;vertical-align:middle;}
.tw_{background:var(--gold2);color:#000;}
.tg_{background:var(--green2);color:#000;}
.tb_{background:var(--blue2);color:#000;}
.tr_{background:var(--red2);color:#fff;}
.tp_{background:var(--purple2);color:#fff;}
.tgr{background:#444;color:#ddd;}

/* TRACK */
.tk{display:flex;gap:4px;flex-wrap:wrap;}
.yw{font-size:9px;font-weight:700;padding:2px 6px;border-radius:2px;white-space:nowrap;background:rgba(245,200,66,0.12);color:var(--gold2);border:1px solid rgba(245,200,66,0.25);}
.yt{font-size:9px;padding:2px 6px;border-radius:2px;white-space:nowrap;background:rgba(74,144,217,0.10);color:var(--blue2);border:1px solid rgba(74,144,217,0.2);}
.yr{font-size:9px;padding:2px 6px;border-radius:2px;white-space:nowrap;background:rgba(224,85,85,0.08);color:var(--red2);border:1px solid rgba(224,85,85,0.18);}

/* TOP3 카드 */
.t3grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-bottom:6px;}
.t3block{background:var(--bg2);border:1px solid var(--border);border-radius:4px;overflow:hidden;}
.t3head{padding:8px 12px;font-size:10px;font-weight:700;letter-spacing:.5px;}
.t3-elem{background:rgba(74,144,217,0.12);color:#7ab8f5;border-bottom:1px solid rgba(74,144,217,0.2);}
.t3-mid{background:rgba(74,144,217,0.10);color:var(--blue2);border-bottom:1px solid rgba(74,144,217,0.18);}
.t3-hi{background:rgba(74,204,122,0.08);color:var(--green2);border-bottom:1px solid rgba(74,204,122,0.15);}
.t3-univ{background:rgba(224,85,85,0.08);color:var(--red2);border-bottom:1px solid rgba(224,85,85,0.15);}
.t3-real{background:rgba(154,96,224,0.08);color:var(--purple2);border-bottom:1px solid rgba(154,96,224,0.15);}
.t3row{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border-bottom:1px solid var(--border);}
.t3row:last-child{border-bottom:none;}
.t3rank{font-family:'Bebas Neue',sans-serif;font-size:22px;line-height:1;color:var(--text3);min-width:20px;}
.t3rank.r1{color:var(--gold2);}
.t3rank.r2{color:#aaa;}
.t3rank.r3{color:#8b6914;}
.t3body{flex:1;}
.t3name{font-weight:700;color:#fff;font-size:13px;line-height:1.3;}
.t3org{font-size:10px;color:var(--blue2);margin-top:2px;}
.t3ev{font-size:9.5px;color:var(--text2);margin-top:5px;line-height:1.6;}
.t3ev strong{color:var(--gold2);}

/* 파이프라인 */
.pl-row{display:flex;align-items:center;gap:6px;padding:7px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:3px;margin-bottom:5px;flex-wrap:wrap;font-size:11.5px;}
.pl-s{color:var(--blue2);font-weight:700;}
.pl-a{color:var(--text3);}
.pl-u{color:var(--green2);font-weight:700;}
.pl-r{color:var(--purple2);font-weight:700;}
.pl-n{color:var(--text3);font-size:10px;}
.pl-cat{font-size:11px;color:var(--text3);margin:14px 0 6px;font-weight:700;}

/* 매치업 */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px;}
.mc{background:var(--bg2);border:1px solid var(--border);border-radius:4px;padding:12px 14px;}
.mc-t{font-size:10px;color:var(--text3);margin-bottom:8px;}
.mc-p{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.mc-a{font-weight:700;color:#fff;font-size:13px;}
.mc-b{font-weight:700;color:var(--red2);font-size:13px;}
.mc-vs{color:var(--text3);font-size:10px;}
.mc-d{font-size:10px;color:var(--text2);margin-top:6px;line-height:1.65;}
.h2h{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border2);}
.h2h-rec{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:8px;}
.h2h-w{font-size:18px;font-weight:800;color:var(--gold2);}
.h2h-l{font-size:18px;font-weight:800;color:var(--text3);}
.h2h-sep{font-size:11px;color:var(--text3);}
.h2h-log{display:flex;flex-direction:column;gap:5px;}
.h2h-row{display:flex;align-items:center;gap:7px;font-size:10px;}
.h2h-date{color:var(--text3);min-width:78px;flex-shrink:0;}
.h2h-res{font-weight:700;padding:1px 6px;border-radius:2px;font-size:9px;flex-shrink:0;}
.h2h-res.win{background:rgba(245,200,66,0.15);color:var(--gold2);}
.h2h-res.lose{background:rgba(255,255,255,0.06);color:var(--text3);}
.h2h-ev{color:var(--text2);}
.h2h-note{margin-top:8px;font-size:9.5px;color:var(--text3);font-style:italic;}
</style>
</head>
<body>

<div class="hd">
  <div class="h1">KOR KUMDO REPORT 2026</div>
  <div class="hsub">2022–2026 세대별 선수 종합 · 공식대회 대진표 교차검증 · 61개 파일</div>
  <div class="hbadges">
    <span class="hb hb-b">초등·중학</span>
    <span class="hb hb-g">고등</span>
    <span class="hb hb-r">대학</span>
    <span class="hb hb-p">실업</span>
    <span class="hb hb-gold">국가대표</span>
  </div>
</div>

<div class="nav">
  <div class="nt on" onclick="ST('ov',this)">세대별 TOP3</div>
  <div class="nt" onclick="ST('elem',this)">초등부</div>
  <div class="nt" onclick="ST('mid',this)">중학부</div>
  <div class="nt" onclick="ST('hi',this)">고등부</div>
  <div class="nt" onclick="ST('univ',this)">대학부</div>
  <div class="nt" onclick="ST('real',this)">실업부</div>
  <div class="nt" onclick="ST('rv',this)">상대전적</div>
  <div class="nt" onclick="ST('pl',this)">파이프라인</div>
  <div class="nt" onclick="ST('natl',this)">국가대표</div>
  <div class="nt" onclick="ST('jp',this)">🇯🇵 일본선수</div>
</div>

<div class="search-bar">
  <input type="text" id="kdSearch" class="search-input" placeholder="선수명·학교명 검색 (예: 심민성, 서석고, 인천고)" oninput="kdDoSearch(this.value)">
  <button class="search-clear" id="kdClear" onclick="kdClearSearch()">✕</button>
  <span class="search-count" id="kdCount"></span>
</div>

<div class="ct" id="ct"></div><!-- 데이터는 render.js가 data.json을 읽어 여기 채웁니다 -->

<div style="text-align:center;padding:14px;font-size:10px;color:var(--text3);border-top:1px solid var(--border);margin-top:8px;">
  ⚔ 데이터 기준: 2026.06 · 공식대진표 61개 파일 교차검증 · 2022~2026 5개년 누적
</div>
<script>
// ============ 데이터 렌더러 (data.json → DOM) ============
function kdCellHtml(cell){
  const cls = cell.class ? ' class="'+cell.class+'"' : '';
  return '<td'+cls+'>'+cell.html+'</td>';
}
function kdRenderTableSection(sec){
  let html = '<div class="sec">';
  if(sec.badge_text){
    html += '<div class="sec-hd"><span class="'+sec.badge_cls+'">'+sec.badge_text+'</span><h2>'+sec.heading+'</h2></div>';
  }
  html += '<div class="tw"><table><thead><tr>';
  sec.headers.forEach(h=>{ html += '<th>'+h+'</th>'; });
  html += '</tr></thead><tbody>';
  sec.rows.forEach(row=>{
    html += '<tr>';
    row.cells.forEach(c=>{ html += kdCellHtml(c); });
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  if(sec.extra_html){ html += sec.extra_html; }
  html += '</div>';
  return html;
}
function kdRenderRawSection(sec){
  if(!sec.badge_text) return sec.html; // 뱃지가 없으면 패널 전체가 통짜 raw 블록 (TOP3 등)
  return '<div class="sec"><div class="sec-hd"><span class="'+sec.badge_cls+'">'+sec.badge_text+'</span><h2>'+sec.heading+'</h2></div>'+sec.html+'</div>';
}
function kdRenderPanel(panel){
  let html = '';
  panel.sections.forEach(sec=>{
    html += (sec.type === 'table') ? kdRenderTableSection(sec) : kdRenderRawSection(sec);
  });
  return html;
}

async function kdLoadData(){
  const ct = document.getElementById('ct');
  try{
    const res = await fetch('data.json');
    if(!res.ok) throw new Error('data.json HTTP '+res.status);
    const data = await res.json();
    window.KD_DATA = data; // 디버깅/향후 쿼리용으로 전역 노출

    // 헤더 텍스트 (meta) — 있으면 반영, 실패해도 정적 마크업이 이미 표시되어 있어 안전
    const h1el = document.querySelector('.h1');
    if(h1el && data.meta && data.meta.h1) h1el.textContent = data.meta.h1;
    const hsubel = document.querySelector('.hsub');
    if(hsubel && data.meta && data.meta.hsub) hsubel.textContent = data.meta.hsub;

    let allHtml = '';
    data.panels.forEach(panel=>{
      const cls = 'pn' + (panel.id === 'ov' ? ' on' : '');
      allHtml += '<div class="'+cls+'" id="p-'+panel.id+'">' + kdRenderPanel(panel) + '</div>';
    });
    ct.innerHTML = allHtml;
  }catch(err){
    ct.innerHTML = '<div style="padding:40px;text-align:center;color:var(--red2);">'
      + '⚠️ data.json 로딩 실패: ' + err.message
      + '<br><span style="color:var(--text3);font-size:11px;">index.html과 data.json이 같은 폴더에 있는지, 로컬에서 여는 경우 파일 프로토콜(file://) 제한 때문일 수 있습니다 — 서버(Vercel/GitHub Pages)로 열어주세요.</span></div>';
  }
}
kdLoadData();
</script>
<script>
function ST(id,el){
  document.querySelectorAll('.pn').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.nt').forEach(t=>t.classList.remove('on'));
  document.getElementById('p-'+id).classList.add('on');
  el.classList.add('on');
}

// ===== 검색 기능 =====
let kdAllRows = null;

function kdInit(){
  // 모든 tbody tr을 한 번만 수집 (소속 패널 ID 포함)
  kdAllRows = [];
  document.querySelectorAll('.pn').forEach(panel=>{
    const panelId = panel.id.replace('p-','');
    panel.querySelectorAll('table tbody tr').forEach(tr=>{
      kdAllRows.push({tr:tr, panel:panelId, text:tr.textContent});
    });
  });
}

function kdClearSearch(){
  document.getElementById('kdSearch').value='';
  kdDoSearch('');
}

function kdDoSearch(qRaw){
  if(kdAllRows===null) kdInit();
  const q = qRaw.trim();
  const clearBtn = document.getElementById('kdClear');
  const countEl = document.getElementById('kdCount');
  clearBtn.style.display = q ? 'inline-block' : 'none';

  // 검색어 비었으면 전체 원복
  if(!q){
    kdAllRows.forEach(r=>{
      r.tr.classList.remove('search-hide','search-match');
      kdUnmark(r.tr);
    });
    document.querySelectorAll('.sec').forEach(s=>s.classList.remove('search-hide-sec'));
    countEl.textContent='';
    return;
  }

  const ql = q.toLowerCase();
  let matchCount = 0;
  let firstMatchPanel = null;
  const secVisible = new Set();

  kdAllRows.forEach(r=>{
    const hit = r.text.toLowerCase().includes(ql);
    if(hit){
      r.tr.classList.remove('search-hide');
      r.tr.classList.add('search-match');
      kdMark(r.tr, q);
      matchCount++;
      if(!firstMatchPanel) firstMatchPanel = r.panel;
      const sec = r.tr.closest('.sec');
      if(sec) secVisible.add(sec);
    } else {
      r.tr.classList.add('search-hide');
      r.tr.classList.remove('search-match');
      kdUnmark(r.tr);
    }
  });

  // 매치 없는 섹션(div.sec) 통째로 숨김 — 표 형태 섹션만 해당
  document.querySelectorAll('.sec').forEach(sec=>{
    const hasTable = sec.querySelector('table tbody tr');
    if(hasTable){
      sec.classList.toggle('search-hide-sec', !secVisible.has(sec));
    }
  });

  countEl.textContent = matchCount + '건 일치';

  // 첫 매치가 있는 탭으로 자동 전환 (현재 탭에 결과가 없을 때만)
  const curPanel = document.querySelector('.pn.on');
  const curHasMatch = curPanel && curPanel.querySelector('tr.search-match');
  if(firstMatchPanel && !curHasMatch){
    const targetNav = Array.from(document.querySelectorAll('.nt')).find(nt=>
      nt.getAttribute('onclick').includes("'"+firstMatchPanel+"'")
    );
    if(targetNav) ST(firstMatchPanel, targetNav);
  }
}

function kdMark(tr, q){
  kdUnmark(tr);
  const ql = q.toLowerCase();
  tr.querySelectorAll('td').forEach(td=>{
    kdMarkNode(td, ql);
  });
}

function kdMarkNode(node, ql){
  for(let i=0;i<node.childNodes.length;i++){
    const child = node.childNodes[i];
    if(child.nodeType===3){ // text node
      const txt = child.textContent;
      const lower = txt.toLowerCase();
      const idx = lower.indexOf(ql);
      if(idx>-1){
        const before = txt.slice(0,idx);
        const match = txt.slice(idx, idx+ql.length);
        const after = txt.slice(idx+ql.length);
        const frag = document.createDocumentFragment();
        if(before) frag.appendChild(document.createTextNode(before));
        const mk = document.createElement('mark');
        mk.className='sm';
        mk.textContent=match;
        frag.appendChild(mk);
        if(after) frag.appendChild(document.createTextNode(after));
        node.replaceChild(frag, child);
        i += 2; // skip past inserted nodes
      }
    } else if(child.nodeType===1 && child.tagName!=='MARK'){
      kdMarkNode(child, ql);
    }
  }
}

function kdUnmark(tr){
  tr.querySelectorAll('mark.sm').forEach(mk=>{
    const parent = mk.parentNode;
    parent.replaceChild(document.createTextNode(mk.textContent), mk);
    parent.normalize();
  });
}
</script>
</body>
</html>
